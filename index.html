<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }
        h1 {
            color: black;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            justify-content: center;
            margin: 20px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background: white;
            font-size: 40px;
            cursor: pointer;
            border: 2px solid black;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <h2 id="turn">Turn: X</h2>
    <div id="board">
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
    </div>
    <h2 id="result"></h2>
    <button onclick="restart()">Restart</button>
    <script>
        let turn = "X";
        let gameOver = false;
        let cells = document.querySelectorAll(".cell");
        let win = [
            [0,1,2],
            [3,4,5],
            [6,7,8],
            [0,3,6],
            [1,4,7],
            [2,5,8],
            [0,4,8],
            [2,4,6]
        ];
        for (let i = 0; i < 9; i++) {
            cells[i].onclick = function() {
                if (cells[i].innerText == "" && gameOver == false) {
                    cells[i].innerText = turn;
                    let winner = false;
                    for (let j = 0; j < 8; j++) {
                        if (
                            cells[win[j][0]].innerText == turn &&
                            cells[win[j][1]].innerText == turn &&
                            cells[win[j][2]].innerText == turn
                        ) {
                            winner = true;
                        }
                    }
                    if (winner == true) {
                        document.getElementById("result").innerText = turn + " Wins!";
                        gameOver = true;
                    }
                    else if (
                        cells[0].innerText != "" &&
                        cells[1].innerText != "" &&
                        cells[2].innerText != "" &&
                        cells[3].innerText != "" &&
                        cells[4].innerText != "" &&
                        cells[5].innerText != "" &&
                        cells[6].innerText != "" &&
                        cells[7].innerText != "" &&
                        cells[8].innerText != ""
                    ) {
                        document.getElementById("result").innerText = "Draw!";
                        gameOver = true;
                    }
                    else {
                        if (turn == "X") {
                            turn = "O";
                        }
                        else {
                            turn = "X";
                        }
                        document.getElementById("turn").innerText = "Turn: " + turn;
                    }
                }
            };
        }
        function restart() {
            for (let i = 0; i < 9; i++) {
                cells[i].innerText = "";
            }
            turn = "X";
            gameOver = false;
            document.getElementById("turn").innerText = "Turn: X";
            document.getElementById("result").innerText = "";
        }
    </script>
</body>
</html>
